<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topolgira Realtime Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app-card {
      width: 100%;
      max-width: 950px;
      height: 720px;
      background: #111827;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .left-panel {
      width: 320px;
      background: #0f172a;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 800;
      color: #f43f5e;
    }
    .brand-logo {
      background: linear-gradient(135deg, #f43f5e, #8b5cf6);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #f43f5e;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
    }
    .btn {
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, #f43f5e, #8b5cf6);
      color: white;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #334155;
      color: white;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090d16;
    }
    .chat-header {
      padding: 20px 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
    }
    .messages-feed {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message-bubble {
      max-width: 68%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .message-bubble.outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, #f43f5e, #8b5cf6);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message-bubble.incoming {
      align-self: flex-start;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 20px 24px;
      background: #111827;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="left-panel">
      <div class="brand">
        <div class="brand-logo">❤️</div>
        <span>Topolgira</span>
      </div>

      <div class="status-badge">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" style="font-size: 12px; padding: 8px;" onclick="presetUser('user_a', 'user_b')">Use User A</button>
        <button class="btn btn-secondary" style="font-size: 12px; padding: 8px;" onclick="presetUser('user_b', 'user_a')">Use User B</button>
      </div>

      <div class="form-group">
        <div class="label">My User ID</div>
        <input type="text" id="myUserId" value="user_a" placeholder="My User ID">
      </div>

      <div class="form-group">
        <div class="label">Partner User ID</div>
        <input type="text" id="targetUserId" value="user_b" placeholder="Target User ID">
      </div>

      <button class="btn" onclick="connectWebSocket()">Connect Realtime Chat 💬</button>

      <div style="margin-top: auto; font-size: 12px; color: #64748b; line-height: 1.6;">
        ⚡ <b>Realtime Delivery Testing:</b><br>
        • Tab 1: Click <b>"Use User A"</b><br>
        • Tab 2: Click <b>"Use User B"</b><br>
        • Messages pop up live instantly in both windows!
      </div>
    </div>

    <div class="main-panel">
      <div class="chat-header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #f43f5e, #8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;" id="partnerAvatar">B</div>
          <div>
            <div style="font-weight: 700; font-size: 17px;" id="partnerName">User B</div>
            <div style="font-size: 12px; color: #10b981;">Online & Connected</div>
          </div>
        </div>
      </div>

      <div class="messages-feed" id="messagesFeed">
        <div style="text-align: center; color: #64748b; font-size: 13px; margin: 20px 0;">
          🔒 End-to-End WebSocket Realtime Channel (`ws://localhost:9000/ws`)
        </div>
      </div>

      <div class="input-area">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChatMessage()">
        <button class="btn" style="width: auto; padding: 12px 28px;" onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let ws = null;

    function presetUser(me, target) {
      document.getElementById('myUserId').value = me;
      document.getElementById('targetUserId').value = target;
      connectWebSocket();
    }

    function connectWebSocket() {
      const myUserId = document.getElementById('myUserId').value.trim();
      const targetUserId = document.getElementById('targetUserId').value.trim();

      document.getElementById('partnerName').innerText = targetUserId || 'Partner';
      document.getElementById('partnerAvatar').innerText = (targetUserId || 'P').charAt(0).toUpperCase();

      if (!myUserId) {
        alert('Please enter your User ID');
        return;
      }

      if (ws) {
        ws.close();
      }

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').innerText = `Connected as ${myUserId}`;

        // Send auth handshake
        ws.send(JSON.stringify({
          type: 'auth',
          senderId: myUserId
        }));
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'message') {
            const myUserId = document.getElementById('myUserId').value.trim();
            // Don't render self-sent broadcast messages twice
            if (data.senderId !== myUserId) {
              appendMessage(data.content, 'incoming', data.timestamp);
            }
          } else if (data.type === 'ack') {
            console.log('Delivery ACK:', data);
          }
        } catch (e) {
          console.error('Error parsing WS message:', e);
        }
      };

      ws.onclose = () => {
        document.getElementById('statusDot').classList.remove('connected');
        document.getElementById('statusText').innerText = 'Disconnected';
      };
    }

    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      const myUserId = document.getElementById('myUserId').value.trim();
      const targetUserId = document.getElementById('targetUserId').value.trim();

      if (!text) return;

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert('WebSocket disconnected. Click "Connect Realtime Chat" first.');
        return;
      }

      const payload = {
        type: 'message',
        chatId: 'chat_' + [myUserId, targetUserId].sort().join('_'),
        senderId: myUserId,
        receiverId: targetUserId,
        content: text,
        timestamp: Math.floor(Date.now() / 1000)
      };

      ws.send(JSON.stringify(payload));
      appendMessage(text, 'outgoing', payload.timestamp);
      input.value = '';
    }

    function appendMessage(text, direction, timestamp) {
      const feed = document.getElementById('messagesFeed');
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${direction}`;
      const timeStr = timestamp ? new Date(timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now';

      bubble.innerHTML = `
        <div>${text}</div>
        <div style="font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right;">${timeStr}</div>
      `;
      feed.appendChild(bubble);
      feed.scrollTop = feed.scrollHeight;
    }

    // Auto connect on start
    window.addEventListener('load', () => {
      connectWebSocket();
    });
  </script>
</body>
</html>
